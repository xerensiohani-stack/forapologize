<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sayang Maafin Aku</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{
background:linear-gradient(135deg,#f8f3ff,#efe4ff,#e5d4ff,#d8c0ff);
background-size:400% 400%;
animation:bg 10s ease infinite;
min-height:100vh;
overflow-x:hidden;
overflow-y:auto;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}
@keyframes bg{0%{background-position:0 50%}50%{background-position:100% 50%}100%{background-position:0 50%}}
.container{
width:90%;max-width:700px;
background:rgba(255,255,255,.35);
backdrop-filter:blur(18px);
padding:30px;border-radius:25px;text-align:center;
box-shadow:0 15px 40px rgba(122,80,180,.18);
position:relative;z-index:2;
}
h1{color:#6f42c1;font-size:clamp(28px,5vw,42px);margin-bottom:15px}
p{font-size:18px;line-height:1.8;color:#5d4d75;margin-bottom:25px}
button{
padding:15px 30px;margin:10px;border:none;border-radius:40px;
background:#9d4edd;color:#fff;font-size:17px;font-weight:bold;cursor:pointer;
transition:.3s}
button:hover{transform:scale(1.05)}
#hasil{display:none;margin-top:25px}
#hasil img{width:100%;max-width:260px;aspect-ratio:1/1;object-fit:cover;border-radius:20px}
#hasil h2{margin-top:18px;color:#ff3f7f}
.mawar{position:fixed;top:-40px;font-size:28px;pointer-events:none;animation:jatuh linear forwards}
@keyframes jatuh{
from{transform:translateY(-60px) rotate(0);opacity:1}
to{transform:translateY(110vh) rotate(360deg);opacity:0}
}
@media(max-width:600px){
button{width:100%;max-width:260px}
p{font-size:16px}
}
</style>
</head>
<body>
<div class="container">
<h1>Aku Minta Maaf Sayang 💜</h1>
<p>
Aku memang kadang nggak becus, tapi aku mau kamu tahu satu hal.
Aku benar-benar sayang sama kamu. I love you so much,
istriku, sayangku, cintaku, segalanya buat aku. 🤍
</p>

<button onclick="muncul()">Dimaafin</button>
<button onclick="muncul()">Wajib Dimaafin</button>

<div id="hasil">
<img src="https://i.postimg.cc/wjgF8hJ1/Whats-App-Image-2026-07-13-at-20-40-26.jpg" alt="Foto">
<h2>Mau sleepcall nggak malam ini? 🥺💜</h2>
</div>
</div>

<script>
let started=false;
function muncul(){
document.getElementById("hasil").style.display="block";
if(!started){
started=true;
setInterval(bunga,300);
}
window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"});
}
function bunga(){
const b=document.createElement("div");
b.className="mawar";
b.innerHTML="💜";
b.style.left=Math.random()*100+"vw";
b.style.animationDuration=(4+Math.random()*3)+"s";
b.style.fontSize=(20+Math.random()*18)+"px";
document.body.appendChild(b);
setTimeout(()=>b.remove(),7000);
}
</script>
</body>
</html>
